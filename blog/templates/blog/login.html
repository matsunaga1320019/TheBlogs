{% extends "blog/base.html" %}

{% block title %}Log in - TheBlogs{% endblock %}

{% block content %}
<h2>Log in</h2>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <div class="form-row">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
    </div>
    {% endfor %}
    <button type="submit">Log in</button>
</form>
{% endblock %}
