services:
  - type: web
    name: theblogs
    runtime: python
    plan: free
    buildCommand: >
      pip install uv &&
      uv sync --frozen &&
      uv run manage.py collectstatic --noinput &&
      uv run manage.py migrate
    startCommand: uv run gunicorn TheBlogs.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: theblogs-db
          property: connectionString

databases:
  - name: theblogs-db
    plan: free
